# LabMate API 게이트웨이 — /api/<service>/* 를 각 서비스로 라우팅하고 프론트를 서빙한다.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;   # 자료실 파일 업로드 여유

    # ── 인증 서비스 ──
    location /api/members/ {
        proxy_pass         http://members-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 연구 서비스 ──
    location /api/projects/ {
        proxy_pass         http://projects-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/funds/ {
        proxy_pass         http://funds-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/attendance/ {
        proxy_pass         http://attendance-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/boards/ {
        proxy_pass         http://boards-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/resource/ {
        proxy_pass         http://resource-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 업로드 파일 정적 서빙(읽기 전용) ──
    location /uploads/ {
        alias /srv/uploads/;
        add_header Cache-Control "private, max-age=300";
    }

    # ── 프론트엔드(React 빌드 산출물) ──
    location / {
        proxy_pass         http://frontend:80/;
        proxy_set_header   Host $host;
    }
}
