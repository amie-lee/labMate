server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 자산은 파일명으로 직접 서빙
    location /assets/ {
        try_files $uri =404;
    }

    # SPA 라우팅: 정적 파일 없으면 index.html 로 폴백
    # ($uri/ 폴백을 두지 않음 — /assets 같은 라우트가 빌드 디렉터리로 잡혀 403 나는 것 방지)
    location / {
        try_files $uri /index.html;
    }
}
